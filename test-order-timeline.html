<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Timeline Test</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Order Timeline & Progress Test</h1>
        </div>
        
        <div class="dashboard-content">
            <main class="main-content">
                <div class="content-area">
                    <div class="test-controls">
                        <h2>Test Enhanced Order Timeline</h2>
                        <div class="test-buttons">
                            <button id="showOrderDetails" class="btn btn-primary">Show Order Details with Timeline</button>
                            <button id="testProgressIndicator" class="btn btn-secondary">Test Progress Indicator</button>
                            <button id="renderOrdersTable" class="btn btn-info">Render Orders Table</button>
                        </div>
                    </div>
                    
                    <div id="testResults" class="test-results">
                        <!-- Test results will be displayed here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Include all necessary scripts -->
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/orderManager.js"></script>

    <script>
        // Test script for order timeline and progress indicator
        document.addEventListener('DOMContentLoaded', function() {
            const testResults = document.getElementById('testResults');

            function logResult(message, type = 'info') {
                const resultDiv = document.createElement('div');
                resultDiv.className = `test-result test-${type}`;
                resultDiv.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
                testResults.appendChild(resultDiv);
                testResults.scrollTop = testResults.scrollHeight;
            }

            // Show order details with enhanced timeline
            document.getElementById('showOrderDetails').addEventListener('click', function() {
                try {
                    // Use the first order from mock data
                    const firstOrderId = 'order_001';
                    OrderManager_Instance.showOrderDetails(firstOrderId);
                    logResult(`✅ Order details modal opened for: ${firstOrderId}`, 'success');
                } catch (error) {
                    logResult(`❌ Failed to show order details: ${error.message}`, 'error');
                }
            });

            // Test progress indicator directly
            document.getElementById('testProgressIndicator').addEventListener('click', function() {
                try {
                    const testOrder = MockData.orders[0]; // Get first order
                    const progressIndicator = OrderManager_Instance.createOrderProgressIndicator(testOrder);
                    
                    // Clear previous results and show the progress indicator
                    const container = document.createElement('div');
                    container.className = 'progress-test-container';
                    container.style.cssText = 'margin: 20px 0; padding: 20px; background: var(--bg-secondary); border-radius: 8px;';
                    
                    const title = document.createElement('h3');
                    title.textContent = `Progress Indicator for Order: ${testOrder.id} (Status: ${testOrder.status})`;
                    container.appendChild(title);
                    container.appendChild(progressIndicator);
                    
                    testResults.appendChild(container);
                    
                    logResult(`✅ Progress indicator rendered for order: ${testOrder.id}`, 'success');
                } catch (error) {
                    logResult(`❌ Failed to render progress indicator: ${error.message}`, 'error');
                }
            });

            // Render orders table
            document.getElementById('renderOrdersTable').addEventListener('click', function() {
                try {
                    OrderManager_Instance.renderOrders();
                    logResult(`✅ Orders table rendered successfully`, 'success');
                } catch (error) {
                    logResult(`❌ Failed to render orders table: ${error.message}`, 'error');
                }
            });

            logResult('🚀 Order Timeline Test initialized. Click buttons to test enhanced timeline features.', 'info');
        });
    </script>

    <style>
        .test-controls {
            background-color: var(--bg-secondary);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            border: 1px solid var(--border-primary);
        }

        .test-buttons {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            margin-top: var(--spacing-md);
        }

        .test-results {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: var(--font-size-sm);
        }

        .test-result {
            padding: var(--spacing-xs) 0;
            border-bottom: 1px solid var(--border-primary);
        }

        .test-result:last-child {
            border-bottom: none;
        }

        .test-success {
            color: var(--success-color);
        }

        .test-error {
            color: var(--error-color);
        }

        .test-warning {
            color: var(--warning-color);
        }

        .test-info {
            color: var(--text-secondary);
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: var(--font-weight-medium);
            transition: all var(--transition-fast);
        }

        .btn-primary {
            background-color: var(--discord-blurple);
            color: var(--text-primary);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-primary);
        }

        .btn-info {
            background-color: var(--info-color);
            color: var(--text-primary);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .progress-test-container {
            margin: var(--spacing-lg) 0;
            padding: var(--spacing-lg);
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-primary);
        }

        .progress-test-container h3 {
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }
    </style>
</body>
</html>
