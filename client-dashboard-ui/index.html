<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Services Marketplace - Login</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page">
    <!-- Gaming Background Elements -->
    <div class="gaming-background">
        <div class="bg-overlay"></div>
        <div class="floating-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-glow">
                    <h1 class="platform-logo">
                        <i class="fas fa-gamepad"></i>
                        <span class="logo-text">Gaming Services</span>
                    </h1>
                </div>
                <p class="platform-tagline">Your Gateway to Professional Gaming Services</p>
                <div class="tagline-accent"></div>
            </div>
            
            <div class="login-form">
                <button class="discord-login-btn" id="discordLoginBtn">
                    <div class="btn-content">
                        <i class="fab fa-discord"></i>
                        <span>Login with Discord</span>
                    </div>
                    <div class="btn-glow"></div>
                </button>
                
                <div class="login-features">
                    <div class="feature-item">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure Authentication</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-bolt"></i>
                        <span>Instant Access</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-users"></i>
                        <span>Gaming Community</span>
                    </div>
                </div>
                
                <div class="login-footer">
                    <p>Don't have Discord? <a href="https://discord.com" target="_blank" class="discord-link">Create Account</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
