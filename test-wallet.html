<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Management Test</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>💳 Wallet Management Test</h1>
        </header>
        
        <div class="dashboard-content">
            <main class="main-content">
                <div class="content-area" id="walletTestContainer">
                    <div class="loading-message">
                        <h2>Loading Wallet System...</h2>
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer"></div>
    </div>

    <!-- Notification container -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- Scripts -->
    <script src="js/mockData.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/walletManager.js"></script>
    
    <script>
        // Initialize wallet test
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('Initializing wallet test...');
                
                // Initialize wallet manager
                await walletManager.init();
                
                // Get container
                const container = document.getElementById('walletTestContainer');
                
                // Render wallet interface
                walletManager.renderWalletInterface(container);
                
                console.log('Wallet test initialized successfully');
                
                // Show success notification
                Components.showNotification({
                    type: 'success',
                    title: 'Wallet System Loaded',
                    message: 'Multi-currency wallet interface is ready for testing.',
                    duration: 3000
                });
                
            } catch (error) {
                console.error('Failed to initialize wallet test:', error);
                
                const container = document.getElementById('walletTestContainer');
                container.innerHTML = `
                    <div class="error-message">
                        <h2>❌ Failed to Load Wallet System</h2>
                        <p>Error: ${error.message}</p>
                        <button onclick="location.reload()" class="btn-primary">Retry</button>
                    </div>
                `;
                
                Components.showNotification({
                    type: 'error',
                    title: 'Initialization Failed',
                    message: 'Failed to load wallet system. Check console for details.',
                    duration: 0
                });
            }
        });
    </script>
</body>
</html>
